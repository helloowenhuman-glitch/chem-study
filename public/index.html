<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B3B30">
  <meta name="description" content="개인 리포트의 오답 개념을 복습하고 선수노트 회차별 문제를 풀어보세요.">
  <title>화학노트</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <button type="button" class="brand" data-action="home" aria-label="화학노트 홈으로"><span class="monogram" aria-hidden="true">c</span>화학노트</button>
      <button type="button" class="account-button" id="account-button" data-action="account">로그인</button>
    </header>
    <main id="main" aria-label="학습 화면"><div class="loading" role="status">학습 자료를 불러오고 있습니다.</div></main>
    <nav class="bottom-nav" aria-label="학습 메뉴">
      <button type="button" data-action="home" aria-current="page">홈</button>
      <button type="button" data-action="review">복습</button>
      <button type="button" data-action="rounds">시험 대비</button>
      <button type="button" data-action="records">내 기록</button>
    </nav>
  </div>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <noscript>화학노트를 사용하려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
